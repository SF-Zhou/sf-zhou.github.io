name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# GitHub Pages deployment uses the official artifact workflow (OIDC):
# the generated site is uploaded as an artifact and published by
# actions/deploy-pages — no generated branch is pushed.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # Prebuilt binary from the latest blogen release (no Rust toolchain or
    # compilation needed); the action adds `blogen` to PATH. `v0` is the
    # floating major tag maintained by blogen's release workflow.
    - name: Install blogen
      uses: SF-Zhou/blogen@v0

    - name: Generate site
      run: blogen build

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: public

    # The generated profile README lives in a separate repository, which has no
    # artifact-based deployment; this keeps publishing it automatically.
    - name: Deploy profile README
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        repository-name: SF-Zhou/SF-Zhou
        token: ${{ secrets.TOKEN }}
        branch: master
        folder: profile

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
